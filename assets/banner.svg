      <stop offset="0%" stop-color="#d3f5e8"/>
      <stop offset="100%" stop-color="#eafff6"/>
    </linearGradient>
    <pattern id="stripes" width="42" height="42" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
